trigger:
  branches:
    include:
      - main

pool: Default

variables:
  environment: 'prod'

stages:
  - stage: TFLint
    displayName: TFLint
    jobs:
      - job: TFLint
        displayName: Run TFLint
        steps:
          - task: PowerShell@2
            displayName: Run TFLint
            inputs:
              targetType: inline
              script: |
                tflint --init
                tflint --recursive

  - stage: TFSEC
    displayName: tfsec
    jobs:
      - job: TFSEC
        displayName: Run tfsec
        steps:
          - task: PowerShell@2
            displayName: Run tfsec
            inputs:
              targetType: inline
              script: |
                tfsec .

  - stage: Checkov
    displayName: Checkov
    jobs:
      - job: Checkov
        displayName: Run Checkov
        steps:
          - task: PowerShell@2
            displayName: Run Checkov
            inputs:
              targetType: inline
              script: |
                checkov -d . --framework terraform

  - stage: terraform_validate
    displayName: Terraform Validate and Plan (Prod)
    jobs:
      - job: terraform_init_validate_plan
        displayName: Init Validate and Plan
        steps:
          - task: TerraformTask@5
            displayName: 'Terraform Init (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              backendServiceArm: 'ericsson'
              backendAzureRmResourceGroupName: 'sohit-rg'
              backendAzureRmStorageAccountName: 'sohittfstate001'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'prod.terraform.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'

          - task: TerraformTask@5
            displayName: 'Terraform Plan (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              environmentServiceNameAzureRM: 'ericsson'

  - stage: approval
    displayName: Prod Approval Gate
    dependsOn: terraform_validate
    pool: server
    jobs:
      - job: ManualValidation
        displayName: Manual Validation
        steps:
          - task: ManualValidation@1
            displayName: 'Approval for Prod Apply'
            inputs:
              notifyUsers: 'sohitg89@gmail.com'
              approvers: 'sohitg89@gmail.com'
              instructions: 'Please check the Terraform Plan for Prod environment and approve to proceed with deployment.'

  - stage: apply
    displayName: Terraform Apply (Prod)
    dependsOn: approval
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Apply
        displayName: 'Apply (Prod)'
        steps:
          - task: TerraformTask@5
            displayName: 'Terraform Init (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              backendServiceArm: 'ericsson'
              backendAzureRmResourceGroupName: 'sohit-rg'
              backendAzureRmStorageAccountName: 'sohittfstate001'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'prod.terraform.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Apply (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              environmentServiceNameAzureRM: 'ericsson'
