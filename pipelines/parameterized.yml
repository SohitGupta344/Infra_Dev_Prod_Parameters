trigger:
  branches:
    include:
      - main
      - feature/*
      - none

pool: Default

parameters:
  - name: environment
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: tflint
    displayName: Run TFLint
    type: boolean
    default: true

  - name: tfsec
    displayName: Run tfsec
    type: boolean
    default: true

  - name: checkov
    displayName: Run Checkov
    type: boolean
    default: true

  - name: infracost
    displayName: Run Infracost
    type: boolean
    default: true

  - name: terraform_validate
    displayName: Run terraform validate
    type: boolean
    default: true

  - name: approval
    displayName: Run approval
    type: boolean
    default: true

  - name: apply
    displayName: Run apply
    type: boolean
    default: true

stages:
  # =======================================================
  # Stage: TFLint (Parallel)
  # =======================================================
  - stage: TFLint
    displayName: TFLint
    condition: ${{ parameters.tflint }}
    dependsOn: []
    jobs:
      - job: TFLint
        displayName: Run TFLint
        steps:
          - task: PowerShell@2
            displayName: Run TFLint
            inputs:
              targetType: inline
              script: |
                Write-Host "Running TFLint..."
                tflint --init
                tflint --recursive

  # =======================================================
  # Stage: TFSEC (Parallel)
  # =======================================================
  - stage: TFSEC
    displayName: tfsec
    condition: ${{ parameters.tfsec }}
    dependsOn: []
    jobs:
      - job: TFSEC
        displayName: Run tfsec
        steps:
          - task: PowerShell@2
            displayName: Run tfsec
            inputs:
              targetType: inline
              script: |
                Write-Host "Running tfsec..."
                tfsec .

  # =======================================================
  # Stage: Checkov (Parallel)
  # =======================================================
  - stage: Checkov
    displayName: Checkov
    condition: ${{ parameters.checkov }}
    dependsOn: []
    jobs:
      - job: Checkov
        displayName: Run Checkov
        steps:
          - task: PowerShell@2
            displayName: Run Checkov
            inputs:
              targetType: inline
              script: |
                Write-Host "Running Checkov..."
                checkov -d . --framework terraform

  # =======================================================
  # Stage: Infracost (Parallel)
  # =======================================================
  - stage: Infracost
    displayName: Infracost (${{ parameters.environment }})
    condition: ${{ parameters.infracost }}
    dependsOn: []
    jobs:
      - job: Infracost
        displayName: Run Infracost
        steps:
          - task: PowerShell@2
            displayName: Run Infracost
            inputs:
              targetType: inline
              script: |
                Write-Host "Running Infracost for ${{ parameters.environment }} environment..."
                infracost breakdown --path "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

  # =======================================================
  # Stage: Terraform Init, Validate & Plan (Parallel)
  # =======================================================
  - stage: terraform_validate
    displayName: Terraform Validate and Plan (${{ parameters.environment }})
    condition: ${{ parameters.terraform_validate }}
    dependsOn: []
    jobs:
      - job: terraform_init_validate_plan
        displayName: Init Validate and Plan
        steps:
          - task: TerraformTask@5
            displayName: 'Terraform Init (${{ parameters.environment }})'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              backendServiceArm: 'ericsson'
              backendAzureRmResourceGroupName: 'sohit-rg'
              backendAzureRmStorageAccountName: 'sohittfstate001'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'

          - task: TerraformTask@5
            displayName: 'Terraform Plan (${{ parameters.environment }})'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              environmentServiceNameAzureRM: 'ericsson'
              commandOptions: '-input=false'

  # =======================================================
  # Stage: Manual Approval Gate
  # =======================================================
  - stage: approval
    displayName: Approval Gate (${{ parameters.environment }})
    dependsOn: terraform_validate
    condition: and(${{ parameters.approval }}, succeeded('terraform_validate'))
    pool: server
    jobs:
      - job: ManualValidation
        displayName: Manual Validation
        steps:
          - task: ManualValidation@1
            displayName: 'Approval for ${{ parameters.environment }} Apply'
            inputs:
              notifyUsers: 'sohitg89@gmail.com'
              approvers: 'sohitg89@gmail.com'
              instructions: 'Please check the Terraform Plan for ${{ parameters.environment }} environment and approve to proceed with deployment.'

  # =======================================================
  # Stage: Terraform Apply (ONLY runs on 'main' branch)
  # =======================================================
  - stage: apply
    displayName: Terraform Apply (${{ parameters.environment }})
    dependsOn: approval
    condition: and(${{ parameters.apply }}, succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Apply
        displayName: 'Apply (${{ parameters.environment }})'
        steps:
          - task: TerraformTask@5
            displayName: 'Terraform Init (${{ parameters.environment }})'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              backendServiceArm: 'ericsson'
              backendAzureRmResourceGroupName: 'sohit-rg'
              backendAzureRmStorageAccountName: 'sohittfstate001'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Apply (${{ parameters.environment }})'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              environmentServiceNameAzureRM: 'ericsson'
              commandOptions: '-input=false'
